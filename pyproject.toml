[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "aiosavorum"
version = "0.1.0"
description = "Async Python client for the Savorum HTTP API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Savorum contributors" }]
keywords = ["savorum", "api", "async", "httpx2"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "attrs>=24.2.0",
  "httpx2>=2.14,<3",
]

[project.urls]
Homepage = "https://savorum.app/"
Documentation = "https://github.com/savorum/python-savorum#readme"
Source = "https://github.com/savorum/python-savorum"
"API Reference" = "https://api.savorum.app/"

[dependency-groups]
dev = [
  "openapi-python-client==0.30.0",
  "ruff==0.17.6",
  "build>=1.2,<2",
  "mypy>=1.18,<3",
  "hypothesis>=6,<7",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.0,<2",
  "pytest-cov>=6,<8",
  "twine>=6,<8",
]

[tool.uv.build-backend]
module-name = "aiosavorum"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["aiosavorum/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "N", "A", "DTZ", "PTH", "RSE", "S", "TRY", "PGH", "SLF", "ICN", "FURB", "LOG", "PERF", "ARG", "RET", "COM", "T20", "FA", "TID", "PIE", "ERA", "FBT", "TCH", "ANN", "ASYNC"]
# COM812 is a formatter decision and conflicts with `ruff format`.
ignore = ["E501", "COM812", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"aiosavorum/_transport.py" = ["SLF001"]
"tests/**/*.py" = ["ANN201", "ANN202", "S101", "S106", "SLF001"]
"tools/**/*.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
pretty = true
show_error_codes = true
warn_unreachable = true
packages = ["aiosavorum", "tests"]
exclude = ["^aiosavorum/_generated/"]

[[tool.mypy.overrides]]
module = "aiosavorum._generated.*"
follow_imports = "silent"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["aiosavorum"]
omit = ["aiosavorum/_generated/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
