name: Home Assistant compatibility

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: tools/setup-ci.sh
      - run: uv build --out-dir "$RUNNER_TEMP/dist"
      - run: tools/check-home-assistant.sh "$RUNNER_TEMP"/dist/*.whl
